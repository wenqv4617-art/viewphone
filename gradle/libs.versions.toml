# ============================================================
# 微光机 ViewPhone · 依赖版本唯一来源（宪法 §五.2：禁浮动版本）
# 规则：
#   1. 任何依赖都必须在这里写死版本号，禁止 "latest.release" / "+" / 范围版本。
#   2. 版本号只在被真实构建验证通过后才算「生效」；未验证的条目在注释里标注。
#   3. 本文件是唯一版本来源 —— 模块内禁止硬编码版本字符串。
# ============================================================

[versions]
# ---- 构建工具链（B3 口径：以「本机首次构建成功」为准）----
# Gradle 版本在 gradle/wrapper/gradle-wrapper.properties 中锁定（9.3.0，本机已有缓存）
# 实测证据见 docs/P0-TOOLCHAIN-BASELINE.md
agp = "9.0.1"                     # Android Gradle Plugin（已验证：:probe-android:assembleDebug 通过）
kotlin = "2.4.20"                 # Kotlin / KMP（已验证：Kotlin JVM 插件编译 + 单测通过）

# ---- 测试 ----
junit-jupiter = "6.1.3"           # 已验证：:probe-jvm:test 产出 XML tests=1 failures=0

# ---- Android 与 SDK ----
# compileSdk / minSdk 见各模块 build.gradle.kts（P0 探针取 compileSdk=36 / minSdk=26）
# 尚未加入的依赖（Compose BOM / Room / Ktor / Coroutines / Serialization 等）
# 一律等到对应阶段真正需要时再加，并当场实测 —— 不预先写一堆没验证过的版本号。

[libraries]
# 测试：JUnit 5（JVM 侧）
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }

[plugins]
# 只列 P0 真实应用过的插件；其余（KMP / Detekt / Compose 等）在引入时再加。
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
