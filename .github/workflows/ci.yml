# ============================================================
# 微光机 ViewPhone · Android 门禁
#
# 为什么不查 web 侧：当前阶段只做 Android 主端，web/ 尚未开工。
# 让 CI 去跑未开工目录的检查 = 长期红灯 = 噪音。等 web 真正开工时再加 web 关卡。
#
# 实测教训（别改回去）：
#   ❌ android-actions/setup-android@v3 会去装已被移除的 `tools` 包 → exit 1
#   ❌ `platforms;android-37` 不存在（API 36.1 起包名带次版本号）→ 用 `platforms;android-37.0`
#   ❌ `gradlew` 缺可执行位 → Linux 上 Permission denied (exit 126)
#   ❌ 校验步骤不能排在安装之前（fresh runner 上必然失败）
# ============================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 探测 Android SDK 与 sdkmanager
        run: |
          set -e
          CMDLINE=""
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do
            if [ -x "$d/sdkmanager" ]; then CMDLINE="$d"; fi
          done
          if [ -z "$CMDLINE" ]; then echo "找不到 sdkmanager"; exit 1; fi
          echo "$CMDLINE" >> "$GITHUB_PATH"
          "$CMDLINE/sdkmanager" --version

      - name: 安装 platforms 与 build-tools
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --update > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" "platform-tools"
          for f in "$ANDROID_HOME"/platforms/*/source.properties; do
            echo "  $(dirname "$f" | xargs basename): $(grep -E '^AndroidVersion.ApiLevel=' "$f")"
          done

      - name: 校验 Android 环境（必须在安装之后）
        run: |
          set -e
          found=""
          for f in "$ANDROID_HOME"/platforms/*/source.properties; do
            api=$(grep -E '^AndroidVersion.ApiLevel=' "$f" | cut -d= -f2)
            case "$api" in 37*) found="$f" ;; esac
          done
          if [ -z "$found" ]; then echo "没有 ApiLevel 37 的 platform"; exit 1; fi
          echo "找到 37 平台: $found"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/nodejs
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 编译
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: 单元测试
        run: ./gradlew test --console=plain

      - name: 仓库膨胀门禁（产物/依赖/缓存不得入库）
        run: node tools/ci/check-repo-bloat.mjs

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-verify-logs
          path: |
            .buildlogs/
            androidApp/build/reports/
          retention-days: 1
          if-no-files-found: ignore
