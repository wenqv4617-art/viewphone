# ============================================================
# 微光机 ViewPhone · 门禁 CI（等价于本地 `pnpm verify`）
#
# 与本地同源：同一个入口 `tools/verify/verify.mjs`，同样的关卡顺序。
# 唯一差别：CI 上必须显式准备 Android 工具链（本地是已装好的）。
#
# 实测教训（别改回去）：
#   ❌ 不要用 android-actions/setup-android@v3 —— 会尝试安装已被移除的 `tools` 包并以 exit 1 结束。
#   改用 runner 预装 SDK + 其自带 sdkmanager 声明式安装（与 build-apk.yml 一致）。
# ============================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: 探测 Android SDK 与 sdkmanager
        run: |
          set -e
          CMDLINE=""
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do
            if [ -x "$d/sdkmanager" ]; then CMDLINE="$d"; fi
          done
          if [ -z "$CMDLINE" ]; then echo "找不到 sdkmanager"; exit 1; fi
          echo "$CMDLINE" >> "$GITHUB_PATH"
          "$CMDLINE/sdkmanager" --version

      - name: 安装 platforms 与 build-tools
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 先刷新包列表，否则旧元数据不认识 platforms;android-37（实测）
          sdkmanager --update > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-37/source.properties"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/nodejs
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 缓存 pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 安装 Web 依赖
        run: pnpm install --frozen-lockfile

      # 单一入口：与本地 `pnpm verify` 完全同一套关卡
      - name: 门禁（编译 + 双单测 + 内核 + TS 类型 + 真实调用 + 仓库膨胀）
        run: pnpm verify

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .buildlogs/verify/
          retention-days: 1
          if-no-files-found: ignore
