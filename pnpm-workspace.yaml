# ============================================================
# pnpm workspace（仓库根）
# 目的：让 web/* 能以 workspace 依赖方式引用 shared 的 Kotlin/JS 产物，
#       且**不经过 npm 发布**（P0 阶段不需要私有 registry）。
# ============================================================
packages:
  - "web/*"
allowBuilds:
  esbuild: true
