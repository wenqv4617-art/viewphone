# ============================================================
# 微光机 ViewPhone · 仓库级 Gradle 配置
# 规则：这里只放与「机器」无关的配置。
#      JDK 路径、SDK 路径、代理等机器专属配置写在本机
#      %USERPROFILE%\.gradle\gradle.properties（不进仓库）。
# ============================================================

# ---- 构建性能 ----
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：实测与 Kotlin 插件的 KotlinCompile 任务存在序列化冲突
# （Gradle 9.3.0 + Kotlin 2.4.20，见 .buildlogs/build1.log：
#  "Configuration cache state could not be cached: ... KotlinCompile$ClasspathSnapshotProperties"）
# 因此 P0 阶段保持关闭；待 KGP 修复后重新评估。
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# ---- Kotlin ----
kotlin.code.style=official

# ---- AndroidX ----
android.useAndroidX=true
# Jetifier 无需开启（本项目所有依赖均已是 AndroidX）
android.enableJetifier=false
