# ============================================================
# 微光机 ViewPhone · 仓库级 Gradle 配置
# 规则：这里只放与「机器」无关的配置。
#      JDK 路径、SDK 路径、代理等机器专属配置写在本机
#      %USERPROFILE%\.gradle\gradle.properties（不进仓库）。
# ============================================================

# ---- 构建性能 ----
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：已开启。首次构建曾报 KotlinCompile 序列化错误，经复测确认那是
# 「依赖下载超时」的连带产物而非 KGP 缺陷 —— 证据与复查点见 docs/DECISIONS.md DEC-001。
# 若报告里不再出现 "Reusing configuration cache"，按 DEC-001 的复查点重新评估。
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# ---- Kotlin ----
kotlin.code.style=official

# ---- AndroidX ----
android.useAndroidX=true
# Jetifier 无需开启（本项目所有依赖均已是 AndroidX）
android.enableJetifier=false
